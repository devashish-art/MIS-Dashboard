<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snackible MIS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0B0F14;
    --bg-1: #111722;
    --bg-2: #171E2B;
    --bg-3: #1E2735;
    --border: rgba(255,255,255,0.08);
    --text-primary: #F2F4F7;
    --text-secondary: #9AA4B2;
    --text-tertiary: #667085;
    --accent: #0EA5A0;
    --accent-soft: rgba(14,165,160,0.12);
    --green: #22C55E;
    --red: #F87171;
    --amber: #FBAE25;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-0);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .mono { font-family: 'Geist Mono', monospace; }

  .shell {
    max-width: 1240px;
    margin: 0 auto;
    padding: 32px 24px 96px;
  }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand span {
    font-size: 13px;
    color: var(--text-tertiary);
  }

  .month-badge {
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 999px;
  }

  /* KPI strip */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  .kpi-card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
  }
  .kpi-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 10px;
    font-weight: 500;
  }
  .kpi-value {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .kpi-delta {
    font-size: 12px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .kpi-delta.up { color: var(--green); }
  .kpi-delta.down { color: var(--red); }
  .kpi-context {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-left: 4px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 4px;
    width: fit-content;
    margin-bottom: 24px;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 150ms ease;
  }
  .tab-btn.active {
    background: var(--bg-3);
    color: var(--text-primary);
  }
  .tab-btn:hover:not(.active) { color: var(--text-primary); }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--bg-1);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin-bottom: 20px;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
  }

  select {
    background: var(--bg-2);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }

  .chart-wrap { position: relative; height: 340px; }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    text-align: right;
    color: var(--text-tertiary);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  thead th:first-child { text-align: left; }
  tbody td {
    padding: 9px 12px;
    text-align: right;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  tbody td:first-child {
    text-align: left;
    color: var(--text-primary);
  }
  tr.group-total td {
    font-weight: 700;
    color: var(--text-primary);
    border-top: 1px solid var(--border);
  }
  tr.group-header td {
    padding-top: 20px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent);
    font-weight: 700;
    border-bottom: none;
  }
  tr.neg td { color: var(--red); }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-tertiary);
  }

  @media (max-width: 900px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="brand">
      <h1>Snackible MIS</h1>
      <span>Income statement</span>
    </div>
    <div class="month-badge mono" id="latestMonthBadge">Loading…</div>
  </header>

  <div id="kpiGrid" class="kpi-grid"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="compare">Channel Comparison</button>
    <button class="tab-btn" data-tab="trend">Trend</button>
    <button class="tab-btn" data-tab="table">Full Statement</button>
  </div>

  <div class="panel active" id="panel-compare">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Channel Comparison</div>
        <div style="display:flex; gap:8px;">
          <select id="compareMetric"></select>
          <select id="compareMonth"></select>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="compareChart"></canvas></div>
    </div>
  </div>

  <div class="panel" id="panel-trend">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Trend Over Time</div>
        <select id="trendMetric"></select>
      </div>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
    </div>
  </div>

  <div class="panel" id="panel-table">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Full Income Statement</div>
      </div>
      <div style="overflow-x:auto;">
        <table id="fullTable">
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = '/api/sheet';

const CHANNELS = [
  'Snackible-Own website',
  'Online Alternate Channels',
  'B2B/Institutional sales channel',
  'General Trade',
  'Modern Trade'
];

const GROUP_MARKERS = [
  { label: 'Total Revenue', metric: 'Revenue' },
  { label: 'Total cost of goods', metric: 'Cost of Goods Sold' },
  { label: 'Gross margin', metric: 'Gross Margin' },
  { label: 'Total Labour Expense', metric: 'Labour Charges' },
  { label: 'Total Delivery Expense', metric: 'Delivery Expense' },
  { label: 'Total CM1', metric: 'CM1' },
  { label: 'Total Marketing Expenses', metric: 'Marketing Expenses' },
  { label: 'Total CM2', metric: 'CM2' },
  { label: 'Total Indirect Expenses', metric: 'Other Indirect Expenses' }
];

const KPI_ROWS = [
  { key: 'Total Net Revenue', label: 'Net Revenue', fmt: 'currency' },
  { key: 'Gross margin', label: 'Gross Margin', fmt: 'currency' },
  { key: 'Total CM1', label: 'CM1', fmt: 'currency' },
  { key: 'Total CM2', label: 'CM2', fmt: 'currency' },
  { key: 'EBITDA', label: 'EBITDA', fmt: 'currency' }
];

const COLORS = ['#0EA5A0', '#FBAE25', '#E35C25', '#6366F1', '#22C55E'];

let RAW = null;
let CHANNEL_GROUPS = {};
let TOTALS_BY_LABEL = {};

function fmtCurrency(n) {
  if (n === null || n === undefined) return '—';
  const abs = Math.abs(n);
  let str;
  if (abs >= 10000000) str = (n / 10000000).toFixed(2) + 'Cr';
  else if (abs >= 100000) str = (n / 100000).toFixed(2) + 'L';
  else if (abs >= 1000) str = (n / 1000).toFixed(1) + 'K';
  else str = n.toFixed(0);
  return '₹' + str;
}

function fmtFull(n) {
  if (n === null || n === undefined) return '—';
  return '₹' + Math.round(n).toLocaleString('en-IN');
}

async function loadData() {
  const res = await fetch(API_URL);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  RAW = json;
  processGroups();
  render();
}

function processGroups() {
  let buffer = [];
  RAW.rows.forEach(row => {
    const marker = GROUP_MARKERS.find(m => m.label === row.label);
    if (marker) {
      const channelRows = buffer.filter(r => CHANNELS.includes(r.label));
      CHANNEL_GROUPS[marker.metric] = channelRows;
      buffer = [];
    } else {
      buffer.push(row);
    }
    TOTALS_BY_LABEL[row.label] = row;
  });
}

function latestMonth() { return RAW.months[RAW.months.length - 1]; }
function prevMonth() { return RAW.months.length > 1 ? RAW.months[RAW.months.length - 2] : null; }

function renderKPIs() {
  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = '';
  const lm = latestMonth();
  const pm = prevMonth();

  KPI_ROWS.forEach(kpi => {
    const row = TOTALS_BY_LABEL[kpi.key];
    const val = row ? row.values[lm] : null;
    const prevVal = row && pm ? row.values[pm] : null;
    let deltaHtml = '';
    if (val !== null && prevVal !== null && prevVal !== 0) {
      const pct = ((val - prevVal) / Math.abs(prevVal)) * 100;
      const up = pct >= 0;
      deltaHtml = `<span class="kpi-delta ${up ? 'up' : 'down'}">${up ? '↑' : '↓'} ${Math.abs(pct).toFixed(1)}%</span><span class="kpi-context">vs ${pm}</span>`;
    }
    const card = document.createElement('div');
    card.className = 'kpi-card';
    card.innerHTML = `
      <div class="kpi-label">${kpi.label}</div>
      <div class="kpi-value">${fmtCurrency(val)}</div>
      ${deltaHtml}
    `;
    grid.appendChild(card);
  });

  document.getElementById('latestMonthBadge').textContent = lm;
}

let compareChartInstance = null;
let trendChartInstance = null;

function renderCompareControls() {
  const metricSel = document.getElementById('compareMetric');
  metricSel.innerHTML = '';
  Object.keys(CHANNEL_GROUPS).forEach(metric => {
    if (CHANNEL_GROUPS[metric].length === 0) return;
    const opt = document.createElement('option');
    opt.value = metric;
    opt.textContent = metric;
    metricSel.appendChild(opt);
  });

  const monthSel = document.getElementById('compareMonth');
  monthSel.innerHTML = '';
  RAW.months.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    monthSel.appendChild(opt);
  });
  monthSel.value = latestMonth();

  metricSel.onchange = renderCompareChart;
  monthSel.onchange = renderCompareChart;
}

function renderCompareChart() {
  const metric = document.getElementById('compareMetric').value;
  const month = document.getElementById('compareMonth').value;
  const rows = CHANNEL_GROUPS[metric] || [];

  const labels = rows.map(r => r.label.replace('Snackible-', '').replace(' sales channel', '').replace(' Channels', ''));
  const data = rows.map(r => r.values[month]);

  const ctx = document.getElementById('compareChart');
  if (compareChartInstance) compareChartInstance.destroy();
  compareChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: data.map(v => v < 0 ? '#F87171' : '#0EA5A0'),
        borderRadius: 6,
        maxBarThickness: 56
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => fmtFull(c.raw) } } },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#9AA4B2', font: { size: 11 } } },
        y: { grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#9AA4B2', callback: (v) => fmtCurrency(v) } }
      }
    }
  });
}

function renderTrendControls() {
  const sel = document.getElementById('trendMetric');
  sel.innerHTML = '';
  const options = [...GROUP_MARKERS.map(m => m.label), 'EBITDA'];
  const seen = new Set();
  RAW.rows.forEach(r => {
    if (options.includes(r.label) && !seen.has(r.label)) {
      seen.add(r.label);
      const opt = document.createElement('option');
      opt.value = r.label;
      opt.textContent = GROUP_MARKERS.find(m => m.label === r.label)?.metric || r.label;
      sel.appendChild(opt);
    }
  });
  sel.onchange = renderTrendChart;
}

function renderTrendChart() {
  const label = document.getElementById('trendMetric').value;
  const row = TOTALS_BY_LABEL[label];
  if (!row) return;

  const data = RAW.months.map(m => row.values[m]);

  const ctx = document.getElementById('trendChart');
  if (trendChartInstance) trendChartInstance.destroy();
  trendChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: RAW.months,
      datasets: [{
        data,
        borderColor: '#0EA5A0',
        backgroundColor: 'rgba(14,165,160,0.12)',
        fill: true,
        tension: 0.3,
        pointRadius: 4,
        pointBackgroundColor: '#0EA5A0',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => fmtFull(c.raw) } } },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#9AA4B2' } },
        y: { grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#9AA4B2', callback: (v) => fmtCurrency(v) } }
      }
    }
  });
}

function renderTable() {
  const head = document.getElementById('tableHead');
  head.innerHTML = '<th>Line Item</th>' + RAW.months.map(m => `<th>${m}</th>`).join('');

  const body = document.getElementById('tableBody');
  body.innerHTML = '';

  let lastSection = null;
  RAW.rows.forEach(row => {
    const isTotal = row.label.toLowerCase().includes('total') || ['Gross margin', 'EBITDA', 'CM 1', 'CM 2'].includes(row.label);
    const tr = document.createElement('tr');
    if (isTotal) tr.className = 'group-total';
    const isPctRow = row.label.trim().startsWith('%');
    const cells = [`<td>${row.label}</td>`].concat(
      RAW.months.map(m => {
        const v = row.values[m];
        if (v === null) return '<td>—</td>';
        return `<td>${isPctRow ? v.toFixed(1) + '%' : fmtFull(v)}</td>`;
      })
    );
    tr.innerHTML = cells.join('');
    body.appendChild(tr);
  });
}

function initTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });
}

function render() {
  renderKPIs();
  renderCompareControls();
  renderCompareChart();
  renderTrendControls();
  renderTrendChart();
  renderTable();
}

initTabs();
loadData().catch(err => {
  document.querySelector('.shell').innerHTML = `<div class="empty-state">Could not load data.<br><span class="mono" style="color:#F87171;">${err.message}</span></div>`;
});
</script>

</body>
</html>
